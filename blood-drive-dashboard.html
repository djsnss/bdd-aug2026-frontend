<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blood Donation Drive 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-neutral-950">

  <!-- background video: replace src with your .mp4, or rename your file to background.mp4
       and place it in the same folder as this HTML file -->
  <video
    autoplay
    muted
    loop
    playsinline
    class="bg-video"
  >
    <source src="assets/BDD_August2026_BG.mp4" type="video/mp4" />
  </video>
  <!-- dark overlay so the tubes/text stay readable over the footage -->
  <div class="fixed inset-0 -z-10 bg-black/20"></div>


  <div id="page-shell" class="relative z-10 flex min-h-screen flex-col items-center justify-center p-6">

    <div id="hub" class="relative z-20 mb-[-28px] flex -translate-y-[30px] justify-center">
      <div class="theme-banner relative flex flex-col items-center rounded-[28px] px-12 py-5 shadow-lg">
        <div class="title-row flex items-center gap-3">
          <svg width="40" height="46" viewBox="0 0 34 40" class="shrink-0">
            <path d="M17 2 C17 2 3 18 3 26 a14 14 0 0 0 28 0 C31 18 17 2 17 2 Z" fill="#c41f36" />
            <path d="M17 2 C17 2 3 18 3 26 a14 14 0 0 0 28 0 C31 18 17 2 17 2 Z" fill="url(#dropShine)" />
            <ellipse cx="11.5" cy="23" rx="3.2" ry="4.4" fill="#ffffff" opacity="0.35" />
            <defs>
              <linearGradient id="dropShine" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff6b81" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#a81529" stop-opacity="0.55" />
              </linearGradient>
            </defs>
          </svg>
          <span class="blood-word text-5xl font-black uppercase leading-none tracking-tight text-[#a81529] md:text-5xl">Blood</span>
          <svg width="40" height="46" viewBox="0 0 34 40" class="shrink-0">
            <path d="M17 2 C17 2 3 18 3 26 a14 14 0 0 0 28 0 C31 18 17 2 17 2 Z" fill="#c41f36" />
            <path d="M17 2 C17 2 3 18 3 26 a14 14 0 0 0 28 0 C31 18 17 2 17 2 Z" fill="url(#dropShine)" />
            <ellipse cx="11.5" cy="23" rx="3.2" ry="4.4" fill="#ffffff" opacity="0.35" />
            <defs>
              <linearGradient id="dropShine" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff6b81" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#a81529" stop-opacity="0.55" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="drive-word -mt-1 text-3xl font-black uppercase leading-none tracking-tight text-[#a81529] md:text-4xl">Donation Drive 2026</span>
      </div>
    </div>

    <div id="dashboard-root" class="relative mx-auto w-full max-w-5xl rounded-2xl border border-[#c41f36]/30 bg-[#fff5f2]/25 backdrop-blur-sm px-10 pb-12 pt-12">

      <div id="row" class="relative mt-6 mx-auto flex max-w-3xl flex-nowrap justify-center gap-x-5">
        <svg id="pipes" class="pointer-events-none absolute inset-0 h-full w-full overflow-visible"></svg>
        <!-- tubes are injected by JS below -->
      </div>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
